name: StackBite native macOS arm64 0.6.0 (private source)
run-name: native-macos-arm64-060-${{ github.run_id }}
# RREL04 (tools/derive_mac.py): the EXECUTED 0.5.123 R3 native job of H3 7e77f771 (build, two equal
# reproducible lanes, MSRV 1.85.1, strip probe, preflights, full TUI lib, package/Mach-O/minos-13 audit,
# runtime QA, lifecycle fresh + 0.5.123 update, provider trust, connect, ordinary PTY) for 0.6.0 on the
# PRIVATE product source; the final build pins the Root-bound L0 runtime-capsule catalog. Manual only: ONE
# arm64 job on the standard public macos-26 runner of Shinick-Han/stackbite; no inputs, no retry,
# no push/PR/tag trigger, no needs, no cache. The other architecture is a separate workflow with its own
# concurrency group, so neither can cancel the other.
# PRODUCT = private shinick-dev/stackbite at the commit pinned in ci/native060-macos/mac060-pins-macos-arm64.json,
# checked out read-only by the pinned actions/checkout with the deploy key secret passed ONLY by name as its
# ssh-key input (persist-credentials false). This workflow's commit is the CI identity H060, never R. Public
# logs carry only step/exit enums; the only artifact is $RUNNER_TEMP/public-summary. timeout-minutes
# 120 is the user-approved cap (0.5.123 R3 measured: arm64 51.5 min macos-26, x86_64 80.1 min macos-15-intel).
# RREL68 R5 FULL + FOCUSED (RREL68 mac/r5mac.py): H060 83ef6d1f with only this comment and the job-step label
# changed; the job body runs all 25 H060 steps plus preflight-2 and preflight-3. Names, ids, runner,
# 120 min timeout, trigger, permissions, concurrency, secret, actions and artifact are unchanged.
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: stackbite-native-macos-arm64-060
  cancel-in-progress: false
jobs:
  native-arm64:
    if: github.repository == 'Shinick-Han/stackbite'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      SB060_PLATFORM: macos-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Read pinned private source commit
        id: pin
        run: |
          c="$(python3 -I -B ci/native060-macos/mac060.py pin source.commit)"
          [[ "$c" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$c" >> "$GITHUB_OUTPUT"
      - name: Check out pinned private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: shinick-dev/stackbite
          ref: ${{ steps.pin.outputs.commit }}
          path: .ci-private-source
          fetch-depth: 1
          ssh-key: ${{ secrets.STACKBITE_SOURCE_DEPLOY_KEY }}
          ssh-strict: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Native arm64 R5 full build, audits, runtime QA, lifecycle, trust, connect, R5 regressions and ordinary PTY
        run: bash ci/native060-macos/mac060-job.sh
      - name: Seal private diagnostics for local decryption
        if: always()
        run: bash ci/native060-macos/seal060.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-macos-arm64-060-${{ github.run_id }}
          path: ${{ runner.temp }}/public-summary
          retention-days: 3
          if-no-files-found: error
